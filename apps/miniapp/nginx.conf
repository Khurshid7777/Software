server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # Docker's DNS: re-resolve "api" so a recreated api container does not cause 502s until nginx restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # Security headers live in a snippet: an add_header inside a location drops the server-level ones.
  include /etc/nginx/snippets/security-headers.conf;

  # Same-origin API: the Mini App calls /api/* and nginx forwards to the api container.
  location /api/ {
    # The internal token (bot ↔ API) never comes from the internet.
    if ($http_authorization ~* "^Internal") {
      return 403;
    }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # AI calls take up to a minute (plus one retry): do not cut them off and make the user pay twice.
    proxy_read_timeout 150s;
  }

  # Hashed bundles never change; index.html must always be fresh so a deploy reaches Telegram's webview.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
