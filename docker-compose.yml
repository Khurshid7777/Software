# Stack for a single VPS in Uzbekistan (personal data stays in-country).
# Put a TLS reverse proxy (Caddy / nginx + Let's Encrypt) in front of `miniapp`:
# Telegram requires HTTPS for Mini Apps.
# docker logs are capped too (./logs/api.log rotates with deploy/logrotate-ishonch).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ishonch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ishonch}
      POSTGRES_DB: ishonch
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ishonch"]
      interval: 5s
      retries: 10

  # Photo storage for listings (module D).
  minio:
    logging: *logging
    # Set MINIO_IMAGE to a tested release tag in .env before going live (":latest" changes on rebuild).
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ishonch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ishonch-secret}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ishonch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ishonch-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ishonch-photos}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
             mc mb --ignore-existing local/$$MINIO_BUCKET"

  api:
    logging: *logging
    build: { context: ., target: api }
    restart: unless-stopped
    init: true # forwards SIGTERM to node: in-flight requests and the expiry job finish cleanly
    env_file: .env
    environment:
      DATABASE_URL: postgres://ishonch:${POSTGRES_PASSWORD:-ishonch}@postgres:5432/ishonch
      LOG_FILE: /app/logs/api.log
      STORAGE_DRIVER: s3
      MINIO_ENDPOINT: http://minio:9000
    volumes: ["./logs:/app/logs"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      retries: 6
      start_period: 30s

  bot:
    logging: *logging
    build: { context: ., target: bot }
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      API_URL: http://api:3000
    # Webhook mode (BOT_WEBHOOK_URL set): nginx in `miniapp` forwards /tg-webhook here.
    expose: ["8081"]
    depends_on:
      api: { condition: service_healthy }

  miniapp:
    logging: *logging
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      # Links on the consent screen (texts prepared by a lawyer), baked into the bundle at build time.
      args:
        VITE_OFFER_URL: ${VITE_OFFER_URL:-}
        VITE_PRIVACY_URL: ${VITE_PRIVACY_URL:-}
        VITE_PROHIBITED_URL: ${VITE_PROHIBITED_URL:-}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    # Loopback only: the TLS proxy (Caddy) is the public entry, and Docker's published ports bypass ufw.
    ports: ["127.0.0.1:${MINIAPP_PORT:-8080}:80"]

volumes:
  pgdata:
  miniodata:
