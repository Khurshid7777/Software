name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishonch
          POSTGRES_PASSWORD: ishonch
          POSTGRES_DB: ishonch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ishonch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ishonch:ishonch@localhost:5432/ishonch
      TEST_DATABASE_URL: postgres://ishonch:ishonch@localhost:5432/ishonch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Dictionaries (ru/uz keys, placeholders, keys used in code)
        run: pnpm check:i18n
      - name: Migrations and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Tests
        run: pnpm test
      - name: Mini App build
        run: pnpm --filter @ishonch/miniapp build
