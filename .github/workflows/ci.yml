name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishonch
          # Throwaway database inside the CI job: no password at all, nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ishonch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ishonch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ishonch@localhost:5432/ishonch
      TEST_DATABASE_URL: postgres://ishonch@localhost:5432/ishonch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Dictionaries (ru/uz keys, placeholders, keys used in code)
        run: pnpm check:i18n
      - name: Migrations and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Tests
        run: pnpm test
      - name: Mini App build
        run: pnpm --filter @ishonch/miniapp build

  e2e:
    # The Mini App in a real browser against the dev API (real PostgreSQL, AI from fixtures).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishonch
          # Throwaway database inside the CI job: no password at all, nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ishonch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ishonch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ishonch@localhost:5432/ishonch
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser
        run: pnpm --filter @ishonch/e2e exec playwright install --with-deps chromium
      - name: Migrations and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: End-to-end tests
        run: pnpm e2e
      - name: Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  docker:
    # The production images build and the compose file is valid: a broken Dockerfile shows up here, not on deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: API image
        run: docker build --target api -t ishonch-api:ci .
      - name: Bot image
        run: docker build --target bot -t ishonch-bot:ci .
      - name: Mini App image
        run: docker build -f apps/miniapp/Dockerfile -t ishonch-miniapp:ci .
